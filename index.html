<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Helper</title>

<style>

/* GENERAL DESIGN */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #183047;
  background-color: #cbd0d2;

  background-image:
    repeating-linear-gradient(
      125deg,
      transparent 0px,
      transparent 38px,
      rgba(50,203,207,0.045) 39px,
      rgba(95,225,221,0.065) 46px,
      transparent 56px,
      transparent 112px
    );
}

header {
  background: linear-gradient(
    135deg,
    #10243b,
    #087caa
  );

  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 10px 0;
  font-size: 28px;
}

header p {
  margin: 5px 0;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 15px;
}

/* CARDS */

.card {
  background: white;
  padding: 18px;
  margin-bottom: 16px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 0;
  font-size: 22px;
}

h3 {
  font-size: 18px;
}

/* TEXT BOX ALIGNMENT */

input,
select,
textarea {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  padding: 12px;
  margin-top: 6px;
  margin-bottom: 14px;
  border: 1px solid #ccd6df;
  border-radius: 9px;
  font-size: 16px;
  background: white;
}

input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 10px;
  font-size: 14px;
}

/* BUTTONS */

button {
  background: #087caa;
  color: white;
  border: none;
  border-radius: 9px;
  padding: 12px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  opacity: 0.7;
}

.secondary {
  background: #e7eef5;
  color: #18324b;
}

.danger {
  background: #b42336;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.row > * {
  flex: 1;
  min-width: 0;
}

/* SIDEBAR */

.sidebar {
  position: fixed;
  top: 0;
  left: -100%;
  width: min(350px, 90vw);
  height: 100%;
  background: #d4d9db;
  z-index: 1000;
  padding: 20px;
  overflow-y: auto;
  transition: left 0.3s;
  box-shadow: 5px 0 20px rgba(0,0,0,0.2);
}

.sidebar.open {
  left: 0;
}

.sidebar h2 {
  margin-bottom: 20px;
}

.sidebar button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  text-align: left;
  background: white;
  color: #183047;
  padding: 16px;
  border-radius: 12px;
}

.sidebar .close-button {
  background: #10243b;
  color: white;
  text-align: center;
}

/* SEPARATE PAGES */

.page {
  display: none;
}

.page.active {
  display: block;
}

/* COUNTDOWN */

.timer-card {
  background: linear-gradient(
    135deg,
    #10243b,
    #087caa
  );
  color: white;
  text-align: center;
}

.timer-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 20px 0;
}

.timer-unit {
  background: rgba(255,255,255,0.15);
  padding: 12px 4px;
  border-radius: 10px;
}

.timer-unit strong {
  display: block;
  font-size: 25px;
}

.timer-unit span {
  font-size: 12px;
}

/* BUDGET */

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.stat {
  background: #edf4fa;
  border-radius: 10px;
  padding: 12px 5px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 18px;
}

.warning {
  background: #fff1d6;
  color: #7b3900;
  padding: 12px;
  border-radius: 10px;
  margin-top: 10px;
}

/* LIST ITEMS */

.list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #e5eaf0;
  padding: 12px 0;
}

.list-item span {
  flex: 1;
  overflow-wrap: anywhere;
}

.completed {
  text-decoration: line-through;
  color: gray;
}

/* SHARE MENU */

.share-menu {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.share-menu.open {
  display: flex;
}

.share-box {
  background: white;
  border-radius: 15px;
  padding: 20px;
  width: 100%;
  max-width: 400px;
  max-height: 90vh;
  overflow-y: auto;
}

.share-box button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
}

/* BOOKING LINKS */

.booking-link {
  display: block;
  background: #eaf6f7;
  color: #075b72;
  text-decoration: none;
  font-weight: bold;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 10px;
}

/* MOBILE OPTIMIZATION */

@media (max-width: 600px) {

  main {
    padding: 12px;
  }

  .card {
    padding: 15px;
  }

  .timer-unit strong {
    font-size: 20px;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(
      auto-fit,
      minmax(min(100%, 135px), 1fr)
    );
  }

  .row button {
    width: 100%;
  }

}

@media print {

  header button,
  .sidebar,
  .share-menu,
  .no-print {
    display: none !important;
  }

  body {
    background: white;
  }

}

</style>
</head>

<body>

<header>

<div class="topbar">

<button onclick="openSidebar()">
☰ Menu
</button>

<h1>✈️ Travel Helper</h1>

<button onclick="openShare()">
↗
</button>

</div>

<p>Plan • Pack • Budget • Explore</p>

</header>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">

<h2>✈️ Trip Tools</h2>

<button onclick="showPage('dashboard')">
🏠 Dashboard
</button>

<button onclick="showPage('checklist')">
🧳 Travel Checklist
</button>

<button onclick="showPage('budget')">
💰 Budget Tracker
</button>

<button onclick="showPage('itinerary')">
📅 Travel Itinerary
</button>

<button onclick="showPage('excursions')">
🏝️ Excursions
</button>

<button onclick="showPage('reminders')">
🔔 Reminders
</button>

<button onclick="showPage('tracker')">
⏱️ Time Tracker
</button>

<button onclick="showPage('booking')">
🌴 Book Your Vacation
</button>

<button onclick="openShare()">
📤 Share & Export
</button>

<button class="close-button"
onclick="closeSidebar()">
✕ Close Menu
</button>

</div>

<main>

<!-- DASHBOARD -->

<section id="dashboard" class="page active">

<div class="card timer-card">

<h2>⏳ Vacation Countdown</h2>

<div class="timer-grid">

<div class="timer-unit">
<strong id="homeDays">00</strong>
<span>Days</span>
</div>

<div class="timer-unit">
<strong id="homeHours">00</strong>
<span>Hours</span>
</div>

<div class="timer-unit">
<strong id="homeMinutes">00</strong>
<span>Minutes</span>
</div>

<div class="timer-unit">
<strong id="homeSeconds">00</strong>
<span>Seconds</span>
</div>

</div>

<p id="countdownMessage">
Create a trip to begin.
</p>

</div>

<div class="card">

<h2>🌎 My Trips</h2>

<label>Select Trip</label>

<select id="tripSelect"
onchange="selectTrip()">
</select>

<div class="row">

<button onclick="newTrip()">
+ New Trip
</button>

<button onclick="renameTrip()"
class="secondary">
Rename
</button>

<button onclick="deleteTrip()"
class="danger">
Delete
</button>

</div>

</div>

<div class="card">

<h2>📅 Trip Details</h2>

<label>Type of Trip</label>

<select id="tripType">

<option value="">
Select Trip Type
</option>

<option>Cruise</option>
<option>Beach Vacation</option>
<option>International Travel</option>
<option>Road Trip</option>
<option>City Break</option>
<option>Camping</option>
<option>Family Vacation</option>
<option>Other</option>

</select>

<label>Destination</label>

<input id="destination"
placeholder="Bahamas, Paris, Miami...">

<label>Departure Date</label>

<input type="date"
id="departure">

<label>Departure Time</label>

<input type="time"
id="departureTime">

<label>Return Date</label>

<input type="date"
id="returnDate">

<button onclick="saveTripDetails()">
Save Trip Details
</button>

</div>

</section>
